services:
  - type: web
    name: rag-assistant
    env: python
    pythonVersion: 3.10
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: EMBEDDINGS_URL
        value: ""
      - key: TFIDF_VECTORIZER_URL
        value: ""
